name: Build Shareef Sons Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build React app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android notification permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8")
          s = t.find("<manifest")
          e = t.find(">", s)
          assert s >= 0 and e >= 0, "AndroidManifest.xml opening manifest tag not found"
          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECORD_AUDIO",
          ]
          insert = ""
          for perm in permissions:
              if perm not in t:
                  insert += f'\n    <uses-permission android:name="{perm}" />'
          if insert:
              t = t[:e+1] + insert + t[e+1:]
              p.write_text(t, encoding="utf-8")
          print("Android notification and exact-alarm permissions configured.")
          PY

      - name: Generate Android App Icon
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#ffffff" \
            --iconBackgroundColorDark "#ffffff"

      - name: Prepare notification logo
        run: |
          mkdir -p android/app/src/main/res/drawable
          ICON_SOURCE=$(find android/app/src/main/res -type f \( -name "ic_launcher.png" -o -name "ic_launcher.webp" \) | head -n 1)
          if [ -z "$ICON_SOURCE" ]; then
            echo "Launcher icon not found"
            exit 1
          fi
          EXT="${ICON_SOURCE##*.}"
          cp "$ICON_SOURCE" "android/app/src/main/res/drawable/shareef_sons_notification.${EXT}"
          echo "Notification logo copied from $ICON_SOURCE"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shareef-Sons-Business-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
