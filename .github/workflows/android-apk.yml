name: Build Shareef Sons Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build React app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android notification permission
        run: | python3 - <<'PY' from pathlib import Path 
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'

          if permission not in text:
              text = text.replace(
                  '<application',
                  permission + '\n\n <application',
                  1
              )

          manifest.write_text(text)
          print("SCHEDULE_EXACT_ALARM permission configured.")
          PY

      - name: Generate Android App Icon
        run: | npx @capacitor/assets generate \ --android \ --assetPath assets \ --iconBackgroundColor "#ffffff" \ --iconBackgroundColorDark "#ffffff" 
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shareef-Sons-Business-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
